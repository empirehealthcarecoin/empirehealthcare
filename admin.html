<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Empire HealthCare - Admin Dashboard">
    <meta name="theme-color" content="#083d77">
    <title>Admin Dashboard - EmpireHealthCare</title>

    <link rel="icon" href="images\Favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. CONFIG: CSS VARIABLES 
           ========================================= */
        :root {
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --color-primary: #083d77;      
            --color-accent: #ffc107;       
            --color-text-dark: #222222;
            --color-text-light: #ffffff;
            --color-bg-light: #fcf7f7;
            --bg-gradient-hero: linear-gradient(to bottom right, #bcdcff, #d6ebff, #ffffff);
            --header-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--font-body);
            background-color: var(--color-bg-light);
            color: var(--color-text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1, h2, h3, .logo, button { font-family: var(--font-heading); }

        /* =========================================
           2. HEADER & NAVIGATION
           ========================================= */
        header {
            background-color: var(--color-primary);
            padding: 0 40px;
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo { font-size: 24px; color: var(--color-text-light); font-weight: 700; text-decoration: none; }
        .logout-btn {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .logout-btn:hover { background-color: #c9302c; }

        /* =========================================
           3. DASHBOARD LAYOUT
           ========================================= */
        .dashboard-wrapper {
            background: var(--bg-gradient-hero); 
            flex: 1;
            padding: 40px 20px;
            display: none; 
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .welcome-banner {
            background-color: white;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border-left: 6px solid var(--color-primary);
        }
        .welcome-banner h1 { color: var(--color-primary); font-size: 1.8rem; margin-bottom: 5px; }

        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
        }
        .card h2 { color: var(--color-primary); margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }

        /* =========================================
           4. TABLE STYLES
           ========================================= */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: var(--color-primary); color: white; font-weight: 500; }
        tr:hover { background-color: #f9f9f9; }
        
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .status-work { background-color: #d9edf7; color: #31708f; }
        .status-leave { background-color: #fcf8e3; color: #8a6d3b; }

        .view-btn {
            background-color: var(--color-primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .view-btn:hover { background-color: #062a52; }

        /* =========================================
           5. MODAL (POP-UP) STYLES
           ========================================= */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #777;
        }
        .close-btn:hover { color: #d9534f; }
        
        .report-section { margin-bottom: 20px; }
        .report-section h3 { border-bottom: 2px solid var(--color-primary); color: var(--color-primary); padding-bottom: 5px; margin-bottom: 10px; }
        .report-section ul { list-style: none; padding: 0; }
        .report-section li { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #eee; }
        .report-section li strong { display: inline-block; width: 160px; color: #555; }

        #loader { text-align: center; padding: 100px; font-size: 1.2rem; color: var(--color-primary); font-weight: bold; }
        footer { background-color: var(--color-primary); color: var(--color-text-light); padding: 20px; text-align: center; }

        @media (max-width: 768px) {
            table { display: block; overflow-x: auto; white-space: nowrap; }
            .report-section li strong { width: 100%; display: block; margin-bottom: 4px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Empire HealthCare - Admin</div>
        <button id="logout-btn" class="logout-btn">Logout</button>
    </header> 

    <div id="loader">Verifying secure connection...</div>

    <main id="dashboard" class="dashboard-wrapper">
        <div class="dashboard-container">
            
            <div class="welcome-banner">
                <h1>Welcome, <span id="admin-name">Admin</span>!</h1>
                <p>Monitor daily employee attendance and field reports below.</p>
            </div>

            <div class="card">
                <h2>Employee Daily Reports</h2>
                <div style="overflow-x:auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Employee Name</th>
                                <th>Status</th>
                                <th>Category</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="report-table-body">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div id="report-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn" id="close-modal">&times;</button>
            <div id="modal-details">
                </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Empire HealthCare. All Rights Reserved.</p>
    </footer>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { doc, getDoc, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const loader = document.getElementById('loader');
        const dashboard = document.getElementById('dashboard');
        const adminNameSpan = document.getElementById('admin-name');
        const logoutBtn = document.getElementById('logout-btn');
        const tableBody = document.getElementById('report-table-body');
        
        // Modal Elements
        const modal = document.getElementById('report-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const modalDetails = document.getElementById('modal-details');

        // 1. Authenticate & Route Protection
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html"; 
            } else {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().isAdmin === true) {
                    adminNameSpan.textContent = userDoc.data().fullName;
                    loader.style.display = 'none';
                    dashboard.style.display = 'block';
                    
                    loadReports();
                } else {
                    window.location.href = "employee.html"; 
                }
            }
        });

        // Helper: Convert camelCase keys to Title Case for nice reading
        function formatKey(key) {
            const result = key.replace(/([A-Z])/g, " $1");
            return result.charAt(0).toUpperCase() + result.slice(1);
        }

        // 2. Fetch and Display Reports
        function loadReports() {
            // Fetch reports ordered by timestamp descending (newest first)
            const q = query(collection(db, "reports"), orderBy("timestamp", "desc"));
            
            onSnapshot(q, (snapshot) => {
                tableBody.innerHTML = ""; 
                
                snapshot.forEach((docSnap) => {
                    const report = docSnap.data();
                    const tr = document.createElement('tr');
                    
                    const statusClass = report.status === 'Work' ? 'status-work' : 'status-leave';
                    
                    tr.innerHTML = `
                        <td>${report.date}</td>
                        <td><strong>${report.employeeName}</strong></td>
                        <td><span class="status-badge ${statusClass}">${report.status}</span></td>
                        <td>${report.category || '-'}</td>
                        <td class="action-cell"></td>
                    `;
                    
                    // Add View Button dynamically
                    const viewBtn = document.createElement('button');
                    viewBtn.className = 'view-btn';
                    viewBtn.textContent = 'View Details';
                    viewBtn.addEventListener('click', () => openModal(report));
                    
                    tr.querySelector('.action-cell').appendChild(viewBtn);
                    tableBody.appendChild(tr);
                });
            });
        }

        // 3. Modal Logic
        function openModal(report) {
            let html = `
                <div class="report-section">
                    <h3>General Info</h3>
                    <ul>
                        <li><strong>Employee:</strong> ${report.employeeName}</li>
                        <li><strong>Date:</strong> ${report.date}</li>
                        <li><strong>Status:</strong> ${report.status}</li>
                    </ul>
                </div>
            `;

            if (report.status === 'Work') {
                html += `
                    <div class="report-section">
                        <h3>Time & Hospital</h3>
                        <ul>
                            <li><strong>In-Time:</strong> ${report.inTime || 'N/A'}</li>
                            <li><strong>Out-Time:</strong> ${report.outTime || 'N/A'}</li>
                            <li><strong>Hospital Name:</strong> ${report.hospital?.name || 'N/A'}</li>
                            <li><strong>Area:</strong> ${report.hospital?.area || 'N/A'}</li>
                            <li><strong>Doctor:</strong> ${report.hospital?.doctor || 'N/A'}</li>
                            <li><strong>Technician:</strong> ${report.hospital?.technician || 'N/A'}</li>
                            <li><strong>Existing Machine:</strong> ${report.hospital?.existingMachine || 'N/A'}</li>
                            <li><strong>End User:</strong> ${report.hospital?.endUser || 'N/A'}</li>
                        </ul>
                    </div>
                `;

                html += `
                    <div class="report-section">
                        <h3>Activity: ${report.category}</h3>
                        <ul>
                `;

                if (report.category === 'Sales') {
                    html += `<li><strong>Call Type:</strong> ${report.salesCallType || 'N/A'}</li>`;
                }

                // Loop through all dynamic specific details and print them cleanly
                if (report.details) {
                    for (const [key, value] of Object.entries(report.details)) {
                        html += `<li><strong>${formatKey(key)}:</strong> ${value || 'N/A'}</li>`;
                    }
                }
                html += `</ul></div>`;
            }

            modalDetails.innerHTML = html;
            modal.style.display = 'flex';
        }

        // Close Modal Handlers
        closeModalBtn.addEventListener('click', () => modal.style.display = 'none');
        window.addEventListener('click', (e) => {
            if (e.target === modal) modal.style.display = 'none';
        });

        // 4. Logout
        logoutBtn.addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "login.html");
        });
    </script>
</body>
</html>
