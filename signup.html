<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Empire HealthCare - Employee Registration">
    <meta name="theme-color" content="#083d77">
    <title>Employee Registration - EmpireHealthCare</title>

    <link rel="icon" href="images\Favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --color-primary: #083d77;      
            --color-accent: #ffc107;       
            --color-text-dark: #222222;
            --color-text-light: #ffffff;
            --color-bg-light: #fcf7f7;
            --bg-gradient-hero: linear-gradient(to bottom right, #bcdcff, #d6ebff, #ffffff);
            --header-height: 70px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            background-color: var(--color-bg-light);
            color: var(--color-text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        h1, h2, h3, .logo, button { font-family: var(--font-heading); }

        header {
            background-color: var(--color-primary);
            padding: 0 40px;
            height: var(--header-height);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .logo { font-size: 24px; color: var(--color-text-light); font-weight: 700; text-decoration: none; }

        .content { flex: 1; }
        .signup-wrapper {
            min-height: calc(100vh - var(--header-height) - 60px); 
            background: var(--bg-gradient-hero); 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }
        .signup-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .signup-container h2 { color: var(--color-primary); margin-bottom: 10px; }
        .signup-container p { color: #555; margin-bottom: 25px; }

        /* Form Inputs */
        .signup-form input[type="text"], 
        .signup-form input[type="password"],
        .signup-form input[type="email"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .signup-form input:focus { border-color: var(--color-primary); }

        /* Password Wrapper for Eye Icon */
        .password-wrapper {
            position: relative;
            width: 100%;
        }
        .password-wrapper input {
            padding-right: 45px; /* Give room for the icon */
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 14px;
            cursor: pointer;
            color: #777;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--color-primary); }

        /* Buttons & Links */
        .btn {
            width: 100%;
            background-color: var(--color-primary);
            color: var(--color-text-light);
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s ease;
            margin-top: 10px;
        }
        .btn:hover { background-color: #062a52; transform: translateY(-2px); }

        #error-message { color: #d9534f; font-size: 0.9rem; margin-top: 15px; display: none; font-weight: 500; }
        
        .login-link { margin-top: 20px; display: block; font-size: 0.95rem; color: #555; text-decoration: none; }
        .login-link span { color: var(--color-primary); font-weight: bold; }
        .login-link:hover span { text-decoration: underline; }

        footer { background-color: var(--color-primary); color: var(--color-text-light); padding: 20px; text-align: center; margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <a href="home.html" class="logo">Empire HealthCare</a>
    </header> 

    <main class="content">
        <section class="signup-wrapper">
            <div class="signup-container">
                <h2>Employee Registration</h2>
                <p>Create your portal account to submit daily reports.</p>
                
                <form id="signup-form" class="signup-form">
                    <input type="text" id="fullname" placeholder="Full Name" required>
                    <input type="text" id="username" placeholder="Username" required>
                    
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Password (Min 8 characters)" required minlength="8">
                        <span class="toggle-password" data-target="password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>

                    <div class="password-wrapper">
                        <input type="password" id="confirm-password" placeholder="Confirm Password" required minlength="8">
                        <span class="toggle-password" data-target="confirm-password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                    
                    <button type="submit" id="submit-btn" class="btn">Register Account</button>
                    <p id="error-message"></p>
                </form>

                <a href="login.html" class="login-link">Already have an account? <span>Sign in here</span></a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Empire HealthCare. All Rights Reserved.</p>
    </footer>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        // UI Logic: Toggle Password Visibility
        const toggleIcons = document.querySelectorAll('.toggle-password');
        const eyeSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const eyeSlashSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        toggleIcons.forEach(icon => {
            icon.addEventListener('click', function() {
                const targetInput = document.getElementById(this.getAttribute('data-target'));
                if (targetInput.type === 'password') {
                    targetInput.type = 'text';
                    this.innerHTML = eyeSlashSVG;
                } else {
                    targetInput.type = 'password';
                    this.innerHTML = eyeSVG;
                }
            });
        });

        // Firebase Auth Logic
        const signupForm = document.getElementById('signup-form');
        const errorMessage = document.getElementById('error-message');
        const submitBtn = document.getElementById('submit-btn');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullname').value.trim();
            const rawUsername = document.getElementById('username').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            errorMessage.style.display = "none";

            // 1. Validation Checks
            if (password.length < 8) {
                showError("Password must be at least 8 characters.");
                return;
            }
            if (password !== confirmPassword) {
                showError("Passwords do not match!");
                return;
            }
            if (rawUsername.includes(' ')) {
                showError("Username cannot contain spaces.");
                return;
            }

            // 2. Format Email strictly to company domain
            const email = rawUsername.includes('@') ? rawUsername : `${rawUsername}@empirehealthcare.co.in`;

            submitBtn.textContent = "Registering...";
            submitBtn.disabled = true;

            try {
                // 3. Create Account
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 4. Create Database Profile
                await setDoc(doc(db, "users", user.uid), {
                    fullName: fullName,
                    email: email,
                    isAdmin: false 
                });

                // 5. Success
                alert("Account successfully created! You can now log in.");
                window.location.href = "login.html";

            } catch (error) {
                console.error("Signup Error:", error.code);
                if (error.code === 'auth/email-already-in-use') {
                    showError("This username is already taken. Please choose another.");
                } else if (error.code === 'auth/weak-password') {
                    showError("Password is too weak. Must be at least 8 characters.");
                } else {
                    showError("An error occurred during registration. Please try again.");
                }
                submitBtn.textContent = "Register Account";
                submitBtn.disabled = false;
            }
        });

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = "block";
        }
    </script>
</body>
</html>
