<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Empire HealthCare - Portal Login">
    <meta name="theme-color" content="#083d77">
    <title>Portal Login - EmpireHealthCare</title>

    <link rel="icon" href="images\Favicon.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. CONFIG: CSS VARIABLES
           ========================================= */
        :root {
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --color-primary: #083d77;      
            --color-accent: #ffc107;       
            --color-text-dark: #222222;
            --color-text-light: #ffffff;
            --color-bg-light: #fcf7f7;
            --bg-gradient-hero: linear-gradient(to bottom right, #bcdcff, #d6ebff, #ffffff);
            --header-height: 70px;
            --max-width: 1200px; 
        }

        /* =========================================
           2. RESET & GLOBAL STYLES
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--color-bg-light);
            color: var(--color-text-dark);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, .logo, .nav-links a, .cta, .login-btn {
            font-family: var(--font-heading);
        }

        /* =========================================
           3. HEADER / NAVIGATION
           ========================================= */
        header {
            background-color: var(--color-primary);
            padding: 0 40px;
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            color: var(--color-text-light);
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: none; 
            transition: opacity 0.2s;
        }
        
        .logo:hover {
            opacity: 0.9;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .nav-links li a {
            color: var(--color-text-light);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            padding: 10px;
            position: relative;
            transition: color 0.3s ease;
            display: inline-block; 
        }

        .nav-links li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            background-color: var(--color-accent);
            left: 0;
            bottom: 5px;
            transition: width 0.3s ease;
        }

        .nav-links li a:hover,
        .nav-links li a.active {
            color: var(--color-accent);
        }

        .nav-links li a:hover::after,
        .nav-links li a.active::after {
            width: 100%;
        }

        /* =========================================
           4. LOGIN SECTION
           ========================================= */
        .content {
            flex: 1; 
        }

        .login-wrapper {
            min-height: calc(100vh - var(--header-height) - 60px); 
            background: var(--bg-gradient-hero); 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-container h2 {
            font-size: 2rem;
            color: var(--color-primary);
            margin-bottom: 10px;
        }

        .login-container p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 30px;
        }

        .login-form input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .login-form input:focus {
            border-color: var(--color-primary);
        }

        .login-btn {
            width: 100%;
            background-color: var(--color-primary);
            color: var(--color-text-light);
            padding: 14px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #062a52; 
            transform: translateY(-2px);
        }

        #error-message {
            color: #d9534f;
            font-size: 0.9rem;
            margin-top: 15px;
            display: none;
            font-weight: 500;
        }

        /* =========================================
           5. FOOTER
           ========================================= */
        footer {
            background-color: var(--color-primary);
            color: var(--color-text-light);
            padding: 20px;
            text-align: center;
            margin-top: auto; 
        }

        /* =========================================
           6. MOBILE RESPONSIVENESS
           ========================================= */
        @media screen and (max-width: 768px) {
            header {
                height: auto;
                flex-direction: column;
                padding: 15px 20px; 
                gap: 15px; 
            }
            .nav-links {
                gap: 10px;
                flex-wrap: wrap; 
                justify-content: center;
                width: 100%;
            }
            .nav-links li a {
                padding: 8px 12px;
                font-size: 0.95rem;
            }
            .nav-links li a::after {
                bottom: 4px;
            }
            .login-container {
                padding: 30px 20px;
            }
            .login-container h2 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="home.html" class="logo">Empire HealthCare</a>
        <nav>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="career.html">Career</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header> 

    <main class="content">
        <section class="login-wrapper">
            <div class="login-container">
                <h2>Portal Login</h2>
                <p>Sign in to access your dashboard.</p>
                <form id="login-form" class="login-form">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" class="login-btn">Sign In</button>
                    <p id="error-message"></p>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Empire HealthCare. All Rights Reserved.</p>
    </footer>

<script type="module">
        import { auth, db } from './firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

        const loginForm = document.getElementById('login-form');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Get the raw username input and password
            const rawUsername = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            // Auto-append domain if they didn't type it
            const email = rawUsername.includes('@') ? rawUsername : `${rawUsername}@empirehealthcare.co.in`;
            
            // Reset error message on new attempt
            errorMessage.style.display = "none";

            try {
                // 1. Authenticate user
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Fetch role from Firestore
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    // 3. Redirect based on role
                    if (userData.isAdmin) {
                        window.location.href = "admin.html";
                    } else {
                        window.location.href = "employee.html";
                    }
                } else {
                    errorMessage.textContent = "User profile not found in the database. Contact IT.";
                    errorMessage.style.display = "block";
                }

            } catch (error) {
                // EXPLICIT ERROR HANDLING ADDED HERE
                console.error("Login Error Code:", error.code);
                
                if (error.code === 'auth/user-not-found') {
                    errorMessage.textContent = "Invalid username. No account found with this name.";
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage.textContent = "Wrong password. Please try again.";
                } else if (error.code === 'auth/invalid-credential') {
                    // Note: See the important security note below about this specific error!
                    errorMessage.textContent = "Invalid username or wrong password.";
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage.textContent = "Invalid username format.";
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage.textContent = "Too many failed attempts. Your account is temporarily locked. Try again later.";
                } else if (error.code === 'auth/network-request-failed') {
                    errorMessage.textContent = "Network error. Please check your internet connection.";
                } else {
                    errorMessage.textContent = "An error occurred. Please try again.";
                }
                
                errorMessage.style.display = "block";
            }
        });
    </script>
